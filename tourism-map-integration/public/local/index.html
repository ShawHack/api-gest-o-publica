<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local turístico — Turismo Garça</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui;color:#10213f;background:#f4f7fb}header,main{max-width:1050px;margin:auto;padding:22px}header{display:flex;justify-content:space-between}a{color:#075d57}.card{background:#fff;border-radius:18px;padding:clamp(22px,5vw,54px);box-shadow:0 14px 40px #10213f18}.cover{width:100%;max-height:520px;object-fit:cover;border-radius:14px}h1{line-height:1.15}.meta{color:#52627a}.error{padding:30px;border-left:5px solid #d44848;background:#fff}</style></head><body><header><a href="/turismo/">Turismo Garça</a><a href="/turismo/mapa/">Ver mapa</a></header><main><article id="content" class="card" aria-live="polite">Carregando…</article></main><script>(()=>{const box=document.querySelector('#content');const parts=location.pathname.split('/').filter(Boolean);const slug=decodeURIComponent(parts[parts.length-1]||'');const add=(tag,text,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;box.append(e);return e};fetch(`/api/comtur/content/${encodeURIComponent(slug)}`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(({data:p})=>{box.textContent='';document.title=`${p.title} — Turismo Garça`;const image=(p.media||[]).find(m=>m.kind==='image');if(image){const img=document.createElement('img');img.className='cover';img.src=image.url;img.alt=image.title||`Imagem de ${p.title}`;box.append(img)}add('h1',p.title);if(p.location)add('p',p.location,'meta');if(p.summary)add('p',p.summary);if(p.body&&p.body!==p.summary)add('p',p.body);if(p.contact?.phone)add('p',`Telefone: ${p.contact.phone}`,'meta');if(p.contact?.website){const a=document.createElement('a');a.href=p.contact.website;a.rel='noopener';a.textContent='Visitar site oficial';box.append(a)}}).catch(()=>{box.className='error';box.textContent='Este local ainda não está publicado ou não foi encontrado.';add('p','Consulte o mapa turístico para ver os locais disponíveis.')})})();</script></body></html>
