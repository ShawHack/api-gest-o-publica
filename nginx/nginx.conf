  # Proxy integrado de Painel NovoSGA + Agenda Garca (TVs Oficiais)
  location ^~ /senhas/api/unidades/ {
    error_page 502 = @api_unavailable_502;
    error_page 503 = @api_unavailable_503;
    error_page 504 = @api_unavailable_504;
    proxy_pass http://api:5000/api/agenda/public/novosga-proxy/unidades/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 30s;
  }

  # 3. Gerenciador Geral NovoSGA (Atendentes & Administração)
  location ^~ /senhas/ {
    proxy_pass http://10.15.25.31:80/;
    proxy_http_version 1.1;
    proxy_set_header Host 10.15.25.31;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 300s;
    client_max_body_size 100m;

    proxy_redirect / /senhas/;
    proxy_redirect http://10.15.25.31/ /senhas/;
    proxy_redirect http://10.15.25.31:80/ /senhas/;

    sub_filter 'action="/' 'action="/senhas/';
    sub_filter 'href="/' 'href="/senhas/';
    sub_filter 'src="/' 'src="/senhas/';
    sub_filter "baseUrl: '/'" "baseUrl: '/senhas/'";
    sub_filter 'baseUrl: "/"' 'baseUrl: "/senhas/"';
    sub_filter "App.baseUrl = ''" "App.baseUrl = '/senhas'";
    sub_filter 'App.baseUrl = ""' 'App.baseUrl = "/senhas"';
    sub_filter "url: '/admin/" "url: '/senhas/admin/";
    sub_filter 'url: "/admin/' 'url: "/senhas/admin/';
    sub_filter "url: '/api/" "url: '/senhas/api/";
    sub_filter 'url: "/api/' 'url: "/senhas/api/';
    sub_filter "url='/login'" "url='/senhas/login'";
    sub_filter 'url="/login"' 'url="/senhas/login"';
    sub_filter_types text/css application/javascript application/json;
    sub_filter_once off;
  }

  location = /senhas {
    return 301 /senhas/;
  }

  location = /sga {
    return 301 /senhas/;
  }

  location ^~ /sga/ {
    return 301 /senhas/;
  }

  # Erros institucionais independentes da API; preservar o status original.
  error_page 404 /portal-errors/404.html;
  error_page 500 502 503 504 /portal-errors/unavailable.html;
  location ^~ /portal-errors/ {
    root /opt/backend-public;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
  }
  location @api_unavailable_502 { default_type application/json; return 502 '{"message":"Serviço temporariamente indisponível","code":"BAD_GATEWAY"}'; }
  location @api_unavailable_503 { default_type application/json; return 503 '{"message":"Serviço temporariamente indisponível","code":"UNAVAILABLE"}'; }
  location @api_unavailable_504 { default_type application/json; return 504 '{"message":"Tempo de resposta excedido","code":"GATEWAY_TIMEOUT"}'; }
  location @memorial_route {
    if ($uri ~ "^/(login|monitoramento/login[.]?|auth/(forgot-password|reset-password|verify-email)|medicamentos|compliance|educacao(/.*)?|sepulturas|sepultados/[^/]+|sepultados/edit/[^/]+|meussepultados|meuusuario|usuarios/add|usuarios/edit/[^/]+|shift-handovers(/[^/]+|/edit/[^/]+)?)/?$") {
      rewrite ^ /index.html last;
    }
    return 404;
  }

    # FRONTEND PRINCIPAL (MEMORIAL) SOMENTE NAS ROTAS CONHECIDAS
  # --------------------------------------------------
  location / {
    root /opt/backend-public;
    index index.html;
    try_files $uri $uri/ @memorial_route;
  }

  # --------------------------------------------------
  # HEADERS DE SEGURANCA
  # --------------------------------------------------
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  server_tokens off;
}


# -------------------------------------------------------------
# XIBO CMS - Servidor Dedicado Porta 8080 (Acesso 100% Nativo sem conflito)
# URL Oficial: https://api.garca.sp.gov.br:8080/
# -------------------------------------------------------------
server {
  listen 8080 ssl;
  server_name api.garca.sp.gov.br;

  ssl_certificate     /etc/letsencrypt/live/api.garca.sp.gov.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.garca.sp.gov.br/privkey.pem;

  client_max_body_size 500m;

  location / {
    proxy_pass http://10.15.25.29:80/;
    proxy_http_version 1.1;
    proxy_set_header Host 10.15.25.29;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
