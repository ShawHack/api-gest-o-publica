# ==================================================
# CONFIGURACAO NGINX - SERVIDOR PRODUCAO CORRIGIDO
# ==================================================

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Nginx funde blocos com o mesmo server_name: dois server{} (80 + 443) ignoravam o return 301.
map $server_port $on_http_port {
  80      1;
  default 0;
}
map $uri $is_acme_challenge {
  ~^/.well-known/acme-challenge/  1;
  default                         0;
}
map "$on_http_port$is_acme_challenge" $redirect_to_https {
  "10"    1;
  default 0;
}

# Cadastro Cultura/Memorial usa /register?from=cultura (React SEMIT).
# Demais acessos a /register seguem para GarçaPet.
map $arg_from $register_use_memorial {
  cultura 1;
  default 0;
}

# Produção: um único server (80 ACME + redirect; 443 aplicação)
server {
  listen 80;
  listen 443 ssl;
  server_name api.garca.sp.gov.br localhost;

  # Uploads (PDFs de legislação, documentos, imagens) — padrão nginx é 1m
  client_max_body_size 500m;

  ssl_certificate     /etc/letsencrypt/live/api.garca.sp.gov.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.garca.sp.gov.br/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  if ($redirect_to_https) {
    return 301 https://$host$request_uri;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # ROOT DO MEMORIAL SANTA FAUSTINA
  root /opt/backend-public;

  resolver 127.0.0.11 valid=30s ipv6=off;

  # --------------------------------------------------
  # REDIRECIONAMENTOS (Normalizar Legados para /garcapet/)
  # --------------------------------------------------
  rewrite ^/agendamentos$ /agendamentos/ permanent;
  rewrite ^/servicos$ /servicos/ permanent;
  rewrite ^/formularios$ /formularios/ permanent;
  rewrite ^/iluminacao$ /iluminacao/ permanent;
  rewrite ^/teatro$ /cultura/teatro/teatro.html permanent;
  rewrite ^/teatro/$ /cultura/teatro/teatro.html permanent;
  rewrite ^/cultura$ /cultura/ permanent;

  # Compatibilidade legada SAMA: redireciona rotas sem prefixo para /garcapet/ (exceto /login = Memorial na raiz)
  location = /register {
    if ($register_use_memorial) {
      rewrite ^ /index.html last;
    }
    return 302 /garcapet/register;
  }
  location = /sobre { return 302 /garcapet/sobre; }
  location = /castracao { return 302 /garcapet/castracao; }
  location = /zoologico { return 302 /garcapet/zoologico; }
  location = /funcionalidade { return 302 /garcapet/funcionalidade; }
  location = /denunciar { return 302 /garcapet/denunciar; }
  location = /adotar { return 302 /garcapet/adotar; }
  location = /arvores { return 302 /garcapet/arvores; }
  location = /sama { return 302 /sama/$is_args$args; }
  location = /sama/ { root /opt/backend-public; try_files /sama/index.html =404; add_header Cache-Control "no-store"; }
  location ^~ /pet/ { return 302 /garcapet$request_uri; }
  location ^~ /pets/ { return 302 /garcapet$request_uri; }
  location ^~ /arvore/ { return 302 /garcapet$request_uri; }
  location ^~ /admin/users { return 302 /garcapet$request_uri; }

  # Perfil funciona melhor no caminho canônico com prefixo.
  location = /user/profile {
    return 302 /garcapet/user/profile;
  }

  # --------------------------------------------------
  # GARCAPET (Ajuste de Rota e Estaticos)
  # --------------------------------------------------
  location = /garcapet {
    return 301 /garcapet/;
  }

  location ^~ /garcapet/ {
    rewrite ^/garcapet/sama/?$ /sama/ redirect;
    rewrite ^/garcapet/(arvores|arvore|castracao|zoologico|denunciar|funcionalidade)(/.*)?$ /sama/$1$2 redirect;
    root /opt/backend-public;
    rewrite ^/garcapet/(.*)$ /sama/$1 break;
    index index.html;
    try_files $uri $uri/ /sama/index.html;
    add_header X-Debug-Route "garcapet-fix" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /sama/arvores { root /opt/backend-public; try_files /sama/index.html =404; add_header Cache-Control "no-store"; }
  location = /sama/arvores/ { return 302 /sama/arvores$is_args$args; }
  location = /sama/castracao { root /opt/backend-public; try_files /sama/index.html =404; add_header Cache-Control "no-store"; }
  location = /sama/castracao/ { return 302 /sama/castracao$is_args$args; }
  location = /sama/zoologico { root /opt/backend-public; try_files /sama/index.html =404; add_header Cache-Control "no-store"; }
  location = /sama/zoologico/ { return 302 /sama/zoologico$is_args$args; }
  location = /sama/denunciar { root /opt/backend-public; try_files /sama/index.html =404; add_header Cache-Control "no-store"; }
  location = /sama/denunciar/ { return 302 /sama/denunciar$is_args$args; }
  location = /sama/funcionalidade { root /opt/backend-public; try_files /sama/index.html =404; add_header Cache-Control "no-store"; }
  location = /sama/funcionalidade/ { return 302 /sama/funcionalidade$is_args$args; }
  location ^~ /sama/arvore/ { root /opt/backend-public; try_files /sama/index.html =404; add_header Cache-Control "no-store"; }
  # Suporte para assets que pedem /sama/ ou /semit-a-pet/
  location ^~ /sama/ {
    root /opt/backend-public;
    try_files $uri $uri/ =404;
  }

  location ^~ /semit-a-pet/ {
    return 301 /garcapet/;
  }

  # --------------------------------------------------
  # GARCA CIDADAO (Next.js + FastAPI)
  # Variável + resolver: re-resolve govcidadao-* a cada pedido (evita 502 se o
  # nginx iniciar antes dos containers ou após recreate do stack).
  # --------------------------------------------------
  location ^~ /garca-cidadao-api/ {
    error_page 502 = @api_unavailable_502;
    error_page 503 = @api_unavailable_503;
    error_page 504 = @api_unavailable_504;
    set $gov_cidadao_api govcidadao-api;
    rewrite ^/garca-cidadao-api/(.*)$ /$1 break;
    proxy_pass         http://$gov_cidadao_api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Authorization     $http_authorization;
    proxy_redirect     off;
    client_max_body_size 500m;
    proxy_connect_timeout 15s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
  }

  location = /garca-cidadao {
    set $gov_cidadao_fe govcidadao-frontend:3000;
    proxy_pass         http://$gov_cidadao_fe/garca-cidadao;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_redirect     off;
  }

  location = /logo_garca_cidade.png {
    set $gov_cidadao_fe govcidadao-frontend:3000;
    proxy_pass         http://$gov_cidadao_fe/logo_garca_cidade.png;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
  }

  location = /garca-cidadao/logo_garca_cidade.png {
    set $gov_cidadao_fe govcidadao-frontend:3000;
    proxy_pass         http://$gov_cidadao_fe/logo_garca_cidade.png;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
  }

  location ^~ /garca-cidadao/ {
    set $gov_cidadao_fe govcidadao-frontend:3000;
    proxy_pass         http://$gov_cidadao_fe;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
  }

  location = /ferramentas {
    set $ferramentas_fe ferramentas:3000;
    proxy_pass         http://$ferramentas_fe/ferramentas;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_redirect     off;
    client_max_body_size 100m;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
  }

  location ^~ /ferramentas/ {
    set $ferramentas_fe ferramentas:3000;
    proxy_pass         http://$ferramentas_fe;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
    client_max_body_size 100m;
    proxy_connect_timeout 15s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
  }

  # --------------------------------------------------
  # BACKEND /api
  # --------------------------------------------------
  location /api/ {
    proxy_set_header X-SEMIT-API-Request "1";
    error_page 502 = @api_unavailable_502;
    error_page 503 = @api_unavailable_503;
    error_page 504 = @api_unavailable_504;
    proxy_pass http://api:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 500m;
  }

  # APIs de status e imagens
  location = /health { proxy_pass http://api:5000/health; }
  location = /readyz { proxy_pass http://api:5000/readyz; }
  location = /stats  {
    error_page 502 = @api_unavailable_502;
    error_page 503 = @api_unavailable_503;
    error_page 504 = @api_unavailable_504;
    proxy_pass http://api:5000/stats;
    proxy_set_header Authorization $http_authorization;
  }
  location = /api/stats {
    error_page 502 = @api_unavailable_502;
    error_page 503 = @api_unavailable_503;
    error_page 504 = @api_unavailable_504;
    proxy_pass http://api:5000/api/stats;
    proxy_set_header Authorization $http_authorization;
  }
  
  # -------------------------------------------------------------
  # TV SEMIT - TV Corporativa & Player Xibo (Suporte a /tv/ e /tv-semit/)
  # -------------------------------------------------------------
  
      # -------------------------------------------------------------
  # SEMIT TV / XIBO CMS - Painel de Gestao Externo (/semittv/ & /xibo/)
  # -------------------------------------------------------------
  location ^~ /semittv/ {
    proxy_pass         http://10.15.25.29:80/;
    proxy_http_version 1.1;
    proxy_set_header   Host 10.15.25.29;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Accept-Encoding "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 500m;

    proxy_redirect / /semittv/;
    proxy_redirect http://10.15.25.29/ /semittv/;
    proxy_redirect http://10.15.25.29:80/ /semittv/;

    sub_filter 'action="/' 'action="/semittv/';
    sub_filter 'href="/' 'href="/semittv/';
    sub_filter 'src="/' 'src="/semittv/';
    sub_filter '"public-path" content="/"' '"public-path" content="/semittv/"';
    sub_filter_once off;
  }

  location ^~ /xibo/ {
    proxy_pass         http://10.15.25.29:80/;
    proxy_http_version 1.1;
    proxy_set_header   Host 10.15.25.29;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 500m;
  }

  location = /semittv {
    return 301 /semittv/;
  }

  location = /xibo {
    return 301 /xibo/;
  }

  location ^~ /dist/ {
    proxy_pass         http://10.15.25.29:80/dist/;
    proxy_set_header   Host 10.15.25.29;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
  }

  location ^~ /theme/ {
    proxy_pass         http://10.15.25.29:80/theme/;
    proxy_set_header   Host 10.15.25.29;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
  }

  location ^~ /tv/ {
    proxy_pass         http://tv-semit:3050/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
  }

  location ^~ /tv-semit/ {
    proxy_pass         http://tv-semit:3050/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
  }

  location = /tv {
    return 301 /tv/;
  }

  location = /tv-semit {
    return 301 /tv/;
  }

  location /images/  { proxy_pass http://api:5000/images/; }
  location /images_semit_a_pet/ { proxy_pass http://api:5000/images_semit_a_pet/; }
  # Uploads PNAB (biblioteca de mídias / documentos) — volume em UPLOAD_DIR
  location /uploads/pnab/ {
    proxy_pass http://api:5000/uploads/pnab/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 7d;
    add_header Cache-Control "public";
  }

  # Dashboard técnico (compat: alguns acessos chegam com /br/)
  location = /dashboard.html {
    proxy_pass http://api:5000/dashboard.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
  }

  location = /br/dashboard.html {
    return 301 /dashboard.html;
  }

  # --------------------------------------------------
  # MAPA TURISTICO
  # --------------------------------------------------
  # Compatibilidade: alguns acessos chegam com prefixo /br/.
  # Redireciona para o caminho oficial sem prefixo.
  location = /br/mapaturistico {
    return 301 /mapaturistico/;
  }

  location ^~ /br/mapaturistico/ {
    rewrite ^/br/mapaturistico/(.*)$ /mapaturistico/$1 permanent;
  }

  location = /mapaturistico {
    return 301 /mapaturistico/;
  }

  location ^~ /mapaturistico/ {
    proxy_pass http://api:5000/mapaturistico/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_redirect off;
  }

  location = /garcapet/vacinacao { return 302 /sama/vacinacao$is_args$args; }
  location = /sama/vacinacao/ { return 302 /sama/vacinacao$is_args$args; }
  location = /sama/vacinacao {
    root /opt/backend-public;
    try_files /vacinacao/index.html =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location = /vacinacao { return 302 /garcapet/vacinacao; }
  location = /vacinacao/ { return 302 /garcapet/vacinacao; }
  location = /garcapet/vacinacao/ { return 302 /garcapet/vacinacao; }

  # --------------------------------------------------
  # FLUTTER WEB (Agendamentos, Servicos, etc.)
  # --------------------------------------------------
  location ^~ /agendamentos/ {
    root /opt/backend-public;
    index index.html;
    try_files $uri $uri/ /agendamentos/index.html =404;
  }

  location ^~ /servicos/ {
    root /opt/backend-public;
    index index.html;
    try_files $uri $uri/ /servicos/index.html =404;
  }

  location ^~ /formularios/ {
    root /opt/backend-public;
    index index.html;
    try_files $uri $uri/ /formularios/index.html =404;
  }

  location ^~ /iluminacao/ {
    root /opt/backend-public;
    index index.html;
    try_files $uri $uri/ /iluminacao/index.html =404;
  }

  # --------------------------------------------------
  # PORTAL ROTAS RURAIS (React independente do Memorial)
  # --------------------------------------------------
  location = /rotas-rurais { return 302 /rotas-rurais/proprietario; }
  location ^~ /rotas-rurais/static/ { alias /usr/share/nginx/html/static/; }
  location ^~ /rotas-rurais/fonts/ { alias /usr/share/nginx/html/fonts/; }
  location ^~ /rotas-rurais/data/ {
    alias /usr/share/nginx/html/data/;
    default_type application/geo+json;
    add_header Cache-Control "public, max-age=300" always;
  }
  location = /rotas-rurais/favicon.png { alias /usr/share/nginx/html/favicon.png; }
  location = /rotas-rurais/logo192.png { alias /usr/share/nginx/html/logo192.png; }
  location = /rotas-rurais/manifest.json { alias /usr/share/nginx/html/manifest.json; }
  location = /rotas-rurais/config.js { alias /usr/share/nginx/html/config.js; }
  location = /rotas-rurais/banner-estradas.png { alias /usr/share/nginx/html/banner-estradas.png; }
  location = /rotas-rurais/index.html {
    alias /usr/share/nginx/html/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
  location ^~ /rotas-rurais/ {
    root /usr/share/nginx/html;
    try_files $uri /rotas-rurais/index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # --------------------------------------------------
  # VOTACAO
  # --------------------------------------------------

  location = /ordem-servicos { return 301 /ordem-servicos/; }
  location ^~ /ordem-servicos/ {
    root /opt/backend-public;
    index index.html;
    try_files $uri $uri/ /ordem-servicos/index.html;
  }

  location = /votacao {
    return 301 /votacao/;
  }

  
  # --------------------------------------------------
  # SD_DOCS - Sistema de Documentos e Processos Eletrônicos
  # --------------------------------------------------
  location = /documentos {
    return 301 /docs/;
  }

  location ^~ /documentos/ {
    return 301 /docs/;
  }

  location ^~ /platform-admin {
    return 301 /docs$request_uri;
  }

  location = /docs {
    return 301 /docs/;
  }

  location ^~ /docs/ {
    proxy_intercept_errors on;
    error_page 500 502 503 504 /portal-errors/unavailable.html;
    proxy_pass         http://sd_docs-web:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
  }

  location ^~ /api-docs/ {
    error_page 502 = @api_unavailable_502;
    error_page 503 = @api_unavailable_503;
    error_page 504 = @api_unavailable_504;
    proxy_pass         http://sd_docs-api:3001/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location ^~ /votacao/ {
    proxy_pass http://api:5000/votacao/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_redirect off;
  }

  # --------------------------------------------------

  # -------------------------------------------------------------
  # XIBO CMS - Rotas Internas & AJAX (Garante compatibilidade total do Painel)
  # -------------------------------------------------------------
  location ^~ /folder/     { proxy_pass http://10.15.25.29:80/folder/; proxy_set_header Host 10.15.25.29; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
  location ^~ /layout/     { proxy_pass http://10.15.25.29:80/layout/; proxy_set_header Host 10.15.25.29; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
  location ^~ /campaign/   { proxy_pass http://10.15.25.29:80/campaign/; proxy_set_header Host 10.15.25.29; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
