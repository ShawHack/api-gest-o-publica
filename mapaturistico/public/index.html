<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Turístico de Garça - SP</title>
  <meta name="description" content="Explore os melhores pontos turísticos de Garça, São Paulo. Restaurantes, atrações, cultura, natureza e muito mais no mapa interativo." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Rubik Font (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* === KLINIC SLAB FONT (with serif fallback) === */
    @font-face {
      font-family: 'Klinic Slab';
      src: local('Klinic Slab'), local('KlinicSlab');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      /* Brand Colors */
      --blue:    rgb(56, 77, 156);
      --blue-dk: rgb(38, 52, 110);
      --blue-lt: rgb(80, 105, 190);
      --green:   rgb(116, 150, 102);
      --green-dk:rgb(85, 112, 74);
      --green-lt:rgb(148, 183, 132);
      --orange:  rgb(237, 151, 86);
      --coral:   rgb(238, 112, 112);

      /* UI */
      --bg:       #1c2340;
      --bg-deep:  #151b30;
      --bg-card:  rgba(255,255,255,0.06);
      --text:     #eef2ff;
      --text-muted: rgb(180, 195, 235);
      --text-dim: rgba(255,255,255,0.45);
      --border:   rgba(255,255,255,0.1);
      --border-blue: rgba(56,77,156,0.5);
      --shadow:   0 20px 60px rgba(0,0,0,0.5);
      --radius:   16px;
      --radius-sm:10px;
      --header-h: 80px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* Title font helper */
    .title-font {
      font-family: 'Klinic Slab', 'Playfair Display', Georgia, serif;
    }

    /* ===== HEADER ===== */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      height: var(--header-h);
      background: linear-gradient(135deg, var(--bg-deep) 0%, var(--blue-dk) 100%);
      border-bottom: 2px solid var(--blue);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 14px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    }

    .header-logo-img {
      height: 60px;
      width: auto;
      object-fit: contain;
    }

    .header-divider {
      width: 1px;
      height: 32px;
      background: rgba(255,255,255,0.2);
    }

    .header-title-block { display: flex; flex-direction: column; }

    .header-title {
      font-family: 'Klinic Slab', 'Playfair Display', Georgia, serif;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .header-subtitle {
      font-family: 'Rubik', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--green-lt);
      letter-spacing: 0.3px;
    }

    .header-spacer { flex: 1; }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .btn-header {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 15px;
      border-radius: 8px;
      font-family: 'Rubik', sans-serif;
      font-size: 13px; font-weight: 500;
      cursor: pointer; border: none;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-ghost {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.15); transform: translateY(-1px); }

    .btn-primary {
      background: var(--blue);
      color: white;
    }
    .btn-primary:hover {
      background: var(--blue-lt);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(56,77,156,0.5);
    }

    /* ===== MAP ===== */
    #map {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0; bottom: 56px;
      z-index: 1;
    }

    /* ===== FILTER PANEL ===== */
    .filter-panel {
      position: fixed;
      top: calc(var(--header-h) + 14px);
      left: 14px;
      z-index: 500;
      background: rgba(21, 27, 48, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-blue);
      border-radius: var(--radius);
      padding: 14px 12px;
      width: 196px;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
    }

    .filter-panel.hidden { transform: translateX(-220px); }

    .filter-title {
      font-family: 'Klinic Slab', 'Playfair Display', Georgia, serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--green-lt);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: 'Rubik', sans-serif;
      font-size: 12.5px; font-weight: 400;
      width: 100%; margin-bottom: 4px;
      transition: all 0.2s;
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.65);
      text-align: left;
    }

    .filter-icon {
      width: 26px; height: 26px;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }

    .filter-btn:hover { background: rgba(56,77,156,0.2); color: white; border-color: var(--border-blue); }
    .filter-btn.active { background: rgba(56,77,156,0.25); color: #c8d3f5; border-color: rgba(56,77,156,0.55); }

    .filter-count {
      margin-left: auto;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 1px 7px;
      font-size: 11px; font-weight: 600;
    }

    .filter-toggle-btn {
      position: fixed;
      top: calc(var(--header-h) + 14px);
      left: 14px;
      z-index: 501;
      width: 36px; height: 36px;
      border-radius: 9px;
      background: var(--blue);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 15px;
      display: none;
      align-items: center; justify-content: center;
      box-shadow: var(--shadow);
    }

    /* ===== SEARCH ===== */
    .search-box {
      position: fixed;
      top: calc(var(--header-h) + 14px);
      right: 14px;
      z-index: 500;
      background: rgba(21,27,48,0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-blue);
      border-radius: var(--radius);
      padding: 10px;
      width: 220px;
      box-shadow: var(--shadow);
    }

    .search-input-wrap { position: relative; }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      padding: 8px 34px 8px 12px;
      font-family: 'Rubik', sans-serif;
      font-size: 13px; color: white; outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus { border-color: var(--blue); }

    .search-icon {
      position: absolute; right: 11px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim); font-size: 13px;
      pointer-events: none;
    }

    /* ===== COUNTER BAR ===== */
    .map-counter {
      position: fixed;
      bottom: 56px; left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      background: rgba(21,27,48,0.95);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-blue);
      border-radius: 40px;
      padding: 8px 18px;
      font-family: 'Rubik', sans-serif;
      font-size: 12px; font-weight: 500;
      color: var(--text-muted);
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap;
    }

    .map-counter strong { color: var(--orange); font-size: 15px; font-weight: 700; }

    /* ===== FOOTER ===== */
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 600;
      height: 56px;
      background: linear-gradient(135deg, var(--bg-deep) 0%, var(--blue-dk) 100%);
      border-top: 1px solid var(--border-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 16px;
    }

    .footer-seal {
      height: 38px; width: 38px;
      object-fit: contain;
      border-radius: 50%;
      opacity: 0.9;
      flex-shrink: 0;
    }

    .footer-text {
      text-align: center;
      line-height: 1.4;
    }

    .footer-text .line1 {
      font-family: 'Rubik', sans-serif;
      font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.75);
    }

    .footer-text .line2 {
      font-family: 'Rubik', sans-serif;
      font-size: 11px; font-weight: 400;
      color: rgba(255,255,255,0.5);
    }

    .footer-text .line2 .heart { color: var(--coral); }
    .footer-text .line1 .sep { color: var(--blue-lt); margin: 0 6px; }

    /* ===== MARKERS ===== */
    .marker-balloon {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; transition: transform 0.2s;
    }
    .marker-balloon:hover { transform: scale(1.12) translateY(-4px); }

    .marker-bubble {
      width: 42px; height: 42px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      border: 2px solid rgba(255,255,255,0.3);
    }

    .marker-bubble i { transform: rotate(45deg); font-size: 16px; color: white; }

    .marker-bubble.destaque { animation: pulseMark 2.2s infinite; }

    @keyframes pulseMark {
      0%,100% { box-shadow: 0 6px 20px rgba(0,0,0,0.45), 0 0 0 0 rgba(237,151,86,0.5); }
      50%      { box-shadow: 0 6px 20px rgba(0,0,0,0.45), 0 0 0 10px rgba(237,151,86,0); }
    }

    .marker-label {
      background: rgba(21,27,48,0.92);
      backdrop-filter: blur(10px);
      color: white;
      padding: 2px 8px;
      border-radius: 5px;
      font-family: 'Rubik', sans-serif;
      font-size: 10px; font-weight: 500;
      white-space: nowrap;
      margin-top: 4px;
      border: 1px solid rgba(56,77,156,0.35);
      max-width: 130px;
      overflow: hidden; text-overflow: ellipsis;
    }

    /* ===== POPUP ===== */
    .leaflet-popup-content-wrapper { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup { margin-bottom: 8px !important; }

    .popup-card {
      background: linear-gradient(160deg, rgba(21,27,48,0.99) 0%, rgba(28,35,64,0.99) 100%);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border-blue);
      border-top: 3px solid var(--blue);
      border-radius: 18px;
      overflow: hidden;
      width: 296px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
      font-family: 'Rubik', sans-serif;
    }

    .popup-img { width: 100%; height: 155px; object-fit: cover; display: block; }

    .popup-img-placeholder {
      width: 100%; height: 155px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px;
    }

    .popup-img-placeholder .ph-emoji { font-size: 46px; }
    .popup-img-placeholder span { font-size: 12px; font-weight: 400; opacity: 0.45; color: white; }

    .popup-body { padding: 14px 16px 16px; }

    .popup-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .popup-title {
      font-family: 'Klinic Slab', 'Playfair Display', Georgia, serif;
      font-size: 16px; font-weight: 700;
      color: white; line-height: 1.3;
      margin-bottom: 8px;
    }

    .popup-desc {
      font-size: 12.5px; color: rgba(255,255,255,0.58);
      line-height: 1.6; margin-bottom: 11px;
      display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    .popup-info { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }

    .popup-info-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: rgba(255,255,255,0.52);
    }

    .popup-info-row i { width: 14px; flex-shrink: 0; color: var(--green-lt); }

    .popup-actions { display: flex; gap: 8px; }

    .popup-btn {
      flex: 1; padding: 9px 10px;
      border-radius: 9px; border: none;
      font-family: 'Rubik', sans-serif;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s; text-decoration: none;
    }

    .popup-btn-gps {
      background: var(--blue);
      color: white;
    }
    .popup-btn-gps:hover { background: var(--blue-lt); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56,77,156,0.45); }

    .popup-btn-share {
      background: rgba(116,150,102,0.18);
      color: var(--green-lt);
      border: 1px solid rgba(116,150,102,0.3);
    }
    .popup-btn-share:hover { background: rgba(116,150,102,0.3); transform: translateY(-2px); }

    .popup-btn-landing {
      background: rgba(237,151,86,0.18);
      color: #f7d0a8;
      border: 1px solid rgba(237,151,86,0.3);
      flex: 0 0 42px;
    }
    .popup-btn-landing:hover { background: rgba(237,151,86,0.3); transform: translateY(-2px); }

    /* Category colors - markers */
    .cat-atracao    { background: linear-gradient(135deg, rgb(56,77,156), rgb(80,105,190)); }
    .cat-restaurante{ background: linear-gradient(135deg, rgb(238,112,112), rgb(200,80,80)); }
    .cat-hotel      { background: linear-gradient(135deg, rgb(237,151,86), rgb(200,115,55)); }
    .cat-comercio   { background: linear-gradient(135deg, rgb(116,150,102), rgb(85,112,74)); }
    .cat-cultura    { background: linear-gradient(135deg, rgb(90,60,140), rgb(130,100,180)); }
    .cat-natureza   { background: linear-gradient(135deg, rgb(116,150,102), rgb(80,120,65)); }
    .cat-servico    { background: linear-gradient(135deg, rgb(80,90,110), rgb(110,120,140)); }
    .cat-clube      { background: linear-gradient(135deg, rgb(59,130,246), rgb(29,78,216)); }
    .cat-religioso  { background: linear-gradient(135deg, rgb(139,92,246), rgb(109,40,217)); }

    .ph-cat-atracao    { background: linear-gradient(135deg, rgba(56,77,156,0.3), rgba(56,77,156,0.15)); }
    .ph-cat-restaurante{ background: linear-gradient(135deg, rgba(238,112,112,0.3), rgba(238,112,112,0.15)); }
    .ph-cat-hotel      { background: linear-gradient(135deg, rgba(237,151,86,0.3), rgba(237,151,86,0.15)); }
    .ph-cat-comercio   { background: linear-gradient(135deg, rgba(116,150,102,0.3), rgba(116,150,102,0.15)); }
    .ph-cat-cultura    { background: linear-gradient(135deg, rgba(90,60,140,0.3), rgba(90,60,140,0.15)); }
    .ph-cat-natureza   { background: linear-gradient(135deg, rgba(116,150,102,0.3), rgba(116,150,102,0.15)); }
    .ph-cat-servico    { background: linear-gradient(135deg, rgba(80,90,110,0.3), rgba(80,90,110,0.15)); }
    .ph-cat-clube      { background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(59,130,246,0.15)); }
    .ph-cat-religioso  { background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(139,92,246,0.15)); }

    .badge-atracao    { background: rgba(56,77,156,0.2);  color: #a8b8f0; border: 1px solid rgba(56,77,156,0.4); }
    .badge-restaurante{ background: rgba(238,112,112,0.2);color: #f7b8b8; border: 1px solid rgba(238,112,112,0.4); }
    .badge-hotel      { background: rgba(237,151,86,0.2); color: #f7d0a8; border: 1px solid rgba(237,151,86,0.4); }
    .badge-comercio   { background: rgba(116,150,102,0.2);color: #b8d4a8; border: 1px solid rgba(116,150,102,0.4); }
    .badge-cultura    { background: rgba(90,60,140,0.2);  color: #c8b4f0; border: 1px solid rgba(90,60,140,0.4); }
    .badge-natureza   { background: rgba(116,150,102,0.2);color: #b8d4a8; border: 1px solid rgba(116,150,102,0.4); }
    .badge-servico    { background: rgba(80,90,110,0.2);  color: #c0c8d8; border: 1px solid rgba(80,90,110,0.4); }
    .badge-clube      { background: rgba(59,130,246,0.2); color: #bfdbfe; border: 1px solid rgba(59,130,246,0.4); }
    .badge-religioso  { background: rgba(139,92,246,0.2); color: #d8b4fe; border: 1px solid rgba(139,92,246,0.4); }

    /* Leaflet zoom controls */
    .leaflet-control-zoom { border: 1px solid var(--border-blue) !important; border-radius: 10px !important; overflow: hidden; }
    .leaflet-control-zoom a { background: rgba(21,27,48,0.97) !important; color: var(--green-lt) !important; border: none !important; }
    .leaflet-control-zoom a:hover { background: rgba(56,77,156,0.4) !important; }

    /* GPS Modal */
    .gps-modal-overlay {
      display: none; position: fixed; inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
    }
    .gps-modal-overlay.active { display: flex; }

    .gps-modal {
      background: linear-gradient(145deg, var(--bg-deep), var(--blue-dk));
      border: 1px solid var(--border-blue);
      border-top: 3px solid var(--blue);
      border-radius: 22px;
      padding: 30px 28px;
      max-width: 370px; width: 92%;
      text-align: center;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
      animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.75) translateY(40px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .gps-modal h3 {
      font-family: 'Klinic Slab', 'Playfair Display', Georgia, serif;
      font-size: 21px; font-weight: 700;
      margin-bottom: 7px; color: white;
    }

    .gps-modal p { font-size: 13px; color: rgba(255,255,255,0.55); margin-bottom: 22px; line-height: 1.6; }

    .gps-options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 14px; }

    .gps-option-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      font-family: 'Rubik', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      text-decoration: none; text-align: left;
    }
    .gps-option-btn:hover { background: rgba(56,77,156,0.25); border-color: var(--border-blue); transform: translateY(-2px); }

    .gps-option-icon {
      width: 40px; height: 40px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }

    .gps-option-text small { display: block; font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.45); margin-top: 1px; }

    .gps-cancel { background: none; border: none; color: rgba(255,255,255,0.35); font-family: 'Rubik', sans-serif; font-size: 13px; cursor: pointer; padding: 6px; transition: color 0.2s; }
    .gps-cancel:hover { color: rgba(255,255,255,0.65); }

    /* Toast */
    .toast {
      position: fixed; bottom: 70px; left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: rgba(21,27,48,0.98);
      border: 1px solid var(--border-blue);
      border-radius: 11px;
      padding: 11px 18px;
      font-family: 'Rubik', sans-serif;
      font-size: 13px; font-weight: 500;
      color: var(--green-lt);
      z-index: 9000; opacity: 0;
      transition: all 0.3s; pointer-events: none;
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      :root { --header-h: 70px; }

      .header-logo-img { height: 48px; }
      .header-title { font-size: 14px; }
      .header-subtitle { font-size: 10px; }

      .filter-panel {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 220px;
        border-radius: 0;
        padding-top: 80px;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 800;
      }
      .filter-panel.mobile-open { transform: translateX(0); }

      .filter-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 799;
      }
      .filter-overlay.active { display: block; }

      .filter-toggle-btn { display: flex; }

      .search-box { display: none; }

      .map-counter { font-size: 11px; padding: 7px 14px; bottom: 62px; }

      .popup-card { width: 270px; }

      .btn-header span { display: none; }
    }

    @media (max-width: 480px) {
      .footer-text .line1 { font-size: 10px; }
      .footer-text .line2 { font-size: 10px; }
      .header-divider { display: none; }
      .header-title-block { display: none; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(56,77,156,0.3); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- FILTER OVERLAY (mobile) -->
  <div class="filter-overlay" id="filterOverlay" onclick="closeFilterMobile()"></div>

  <!-- HEADER -->
  <header class="header">
    <img src="/mapaturistico/garca_logo.png" alt="Garça - Cidade da Tecnologia" class="header-logo-img" />
    <div class="header-divider"></div>
    <div class="header-title-block">
      <span class="header-title">Mapa Turístico</span>
      <span class="header-subtitle">Garça, São Paulo</span>
    </div>
    <div class="header-spacer"></div>
    <div class="header-actions">
      <!-- Mobile filter toggle -->
      <button class="btn-header btn-ghost" id="filterToggleMobile" onclick="toggleFilterMobile()" style="display:none">
        <i class="fas fa-filter"></i>
      </button>
      <a href="/mapaturistico/login.html" class="btn-header btn-ghost">
        <i class="fas fa-cog"></i> <span>Admin</span>
      </a>
    </div>
  </header>

  <!-- FILTER PANEL -->
  <div class="filter-panel" id="filterPanel">
    <div class="filter-title"><i class="fas fa-map-marker-alt" style="margin-right:6px"></i>Categorias</div>
    <button class="filter-btn active" data-cat="all" onclick="filterCategory('all')">
      <div class="filter-icon" style="background:rgba(56,77,156,0.25)">🌟</div>
      Todos
      <span class="filter-count" id="count-all">0</span>
    </button>
    <button class="filter-btn" data-cat="atracao" onclick="filterCategory('atracao')">
      <div class="filter-icon cat-atracao">🎡</div>
      Atração
      <span class="filter-count" id="count-atracao">0</span>
    </button>
    <button class="filter-btn" data-cat="restaurante" onclick="filterCategory('restaurante')">
      <div class="filter-icon cat-restaurante">🍽️</div>
      Restaurante
      <span class="filter-count" id="count-restaurante">0</span>
    </button>
    <button class="filter-btn" data-cat="hotel" onclick="filterCategory('hotel')">
      <div class="filter-icon cat-hotel">🏨</div>
      Hotel
      <span class="filter-count" id="count-hotel">0</span>
    </button>
    <button class="filter-btn" data-cat="comercio" onclick="filterCategory('comercio')">
      <div class="filter-icon cat-comercio">🛍️</div>
      Comércio
      <span class="filter-count" id="count-comercio">0</span>
    </button>
    <button class="filter-btn" data-cat="cultura" onclick="filterCategory('cultura')">
      <div class="filter-icon cat-cultura">🏛️</div>
      Cultura
      <span class="filter-count" id="count-cultura">0</span>
    </button>
    <button class="filter-btn" data-cat="natureza" onclick="filterCategory('natureza')">
      <div class="filter-icon cat-natureza">🌿</div>
      Natureza
      <span class="filter-count" id="count-natureza">0</span>
    </button>
    <button class="filter-btn" data-cat="servico" onclick="filterCategory('servico')">
      <div class="filter-icon cat-servico">🔧</div>
      Serviço
      <span class="filter-count" id="count-servico">0</span>
    </button>
    <button class="filter-btn" data-cat="clube" onclick="filterCategory('clube')">
      <div class="filter-icon cat-clube">⚽</div>
      Clube
      <span class="filter-count" id="count-clube">0</span>
    </button>
    <button class="filter-btn" data-cat="religioso" onclick="filterCategory('religioso')">
      <div class="filter-icon cat-religioso">⛪</div>
      Religioso
      <span class="filter-count" id="count-religioso">0</span>
    </button>
  </div>

  <!-- SEARCH BOX -->
  <div class="search-box">
    <div class="search-input-wrap">
      <input type="text" class="search-input" id="searchInput"
        placeholder="Buscar local..." oninput="searchPoints(this.value)" />
      <i class="fas fa-search search-icon"></i>
    </div>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- COUNTER -->
  <div class="map-counter">
    <i class="fas fa-map-pin"></i>
    <strong id="visibleCount">0</strong> pontos turísticos no mapa
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <img src="/mapaturistico/semit_seal.png" alt="Selo SEMIT" class="footer-seal" />
    <div class="footer-text">
      <div class="line1">
        API SEMIT © 2026 <span class="sep">|</span> Prefeitura Municipal
      </div>
      <div class="line2">
        Desenvolvido com <span class="heart">❤</span> pela equipe de tecnologia
      </div>
    </div>
  </footer>

  <!-- GPS MODAL -->
  <div class="gps-modal-overlay" id="gpsModal">
    <div class="gps-modal">
      <div style="font-size:38px;margin-bottom:10px">🧭</div>
      <h3>Iniciar Navegação</h3>
      <p id="gpsModalDesc">Escolha como deseja navegar até o destino.</p>
      <div class="gps-options" id="gpsOptions"></div>
      <button class="gps-cancel" onclick="closeGpsModal()">Cancelar</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMsg"></span>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const GARCA_CENTER = [-22.2108, -49.6558];

    const map = L.map('map', {
      center: GARCA_CENTER,
      zoom: 14,
      zoomControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      maxZoom: 19
    }).addTo(map);

    // Reposition zoom control
    map.zoomControl.setPosition('bottomright');

    // ============================================================
    const CATS = {
      atracao:    { label: 'Atração',     icon: 'fa-star',         emoji: '🎡' },
      restaurante:{ label: 'Restaurante', icon: 'fa-utensils',     emoji: '🍽️' },
      hotel:      { label: 'Hotel',       icon: 'fa-bed',          emoji: '🏨' },
      comercio:   { label: 'Comércio',    icon: 'fa-shopping-bag', emoji: '🛍️' },
      cultura:    { label: 'Cultura',     icon: 'fa-landmark',     emoji: '🏛️' },
      natureza:   { label: 'Natureza',    icon: 'fa-leaf',         emoji: '🌿' },
      servico:    { label: 'Serviço',     icon: 'fa-wrench',       emoji: '🔧' },
      clube:      { label: 'Clube',       icon: 'fa-futbol',       emoji: '⚽' },
      religioso:  { label: 'Religioso',   icon: 'fa-place-of-worship', emoji: '⛪' }
    };

    let allPoints = [], markers = [], currentFilter = 'all', currentSearch = '';

    // ============================================================
    function createMarkerIcon(ponto) {
      const cat = CATS[ponto.categoria] || CATS.atracao;
      const destaqueClass = ponto.destaque ? ' destaque' : '';
      const html = `
        <div class="marker-balloon">
          <div class="marker-bubble cat-${ponto.categoria}${destaqueClass}">
            <i class="fas ${cat.icon}"></i>
          </div>
          <div class="marker-label">${ponto.nome}</div>
        </div>`;
      return L.divIcon({ html, className: '', iconSize: [140, 74], iconAnchor: [70, 60], popupAnchor: [0, -62] });
    }

    function escapeStr(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

    function createPopupContent(ponto) {
      const cat = CATS[ponto.categoria] || CATS.atracao;
      const imgHtml = ponto.foto
        ? `<img src="${ponto.foto}" alt="${ponto.nome}" class="popup-img"
            onerror="this.parentElement.innerHTML='<div class=&quot;popup-img-placeholder ph-cat-${ponto.categoria}&quot;><div class=&quot;ph-emoji&quot;>${cat.emoji}</div><span>Sem imagem</span></div>'" />`
        : `<div class="popup-img-placeholder ph-cat-${ponto.categoria}"><div class="ph-emoji">${cat.emoji}</div><span>Sem foto</span></div>`;

      return `
        <div class="popup-card">
          ${imgHtml}
          <div class="popup-body">
            <div class="popup-badge badge-${ponto.categoria}">
              ${cat.emoji} ${cat.label}${ponto.destaque ? '&nbsp;⭐' : ''}
            </div>
            <h2 class="popup-title">${ponto.nome}</h2>
            ${ponto.descricao ? `<p class="popup-desc">${ponto.descricao}</p>` : ''}
            <div class="popup-info">
              ${ponto.endereco ? `<div class="popup-info-row"><i class="fas fa-map-marker-alt"></i>${ponto.endereco}</div>` : ''}
              ${ponto.telefone ? `<div class="popup-info-row"><i class="fas fa-phone"></i>${ponto.telefone}</div>` : ''}
              ${ponto.horario  ? `<div class="popup-info-row"><i class="fas fa-clock"></i>${ponto.horario}</div>` : ''}
            </div>
            <div class="popup-actions">
              <button class="popup-btn popup-btn-gps" onclick="openGpsModal('${escapeStr(ponto._id)}',${ponto.latitude},${ponto.longitude},'${escapeStr(ponto.nome)}')">
                <i class="fas fa-route"></i> Ir até aqui
              </button>
              <a class="popup-btn popup-btn-landing" href="/mapaturistico/local.html?id=${encodeURIComponent(ponto._id)}" title="Ver página do local">
                <i class="fas fa-earth-americas"></i>
              </a>
              <button class="popup-btn popup-btn-share" onclick="sharePonto('${escapeStr(ponto.nome)}',${ponto.latitude},${ponto.longitude})">
                <i class="fas fa-share-alt"></i>
              </button>
            </div>
          </div>
        </div>`;
    }

    // ============================================================
    async function loadPoints() {
      try {
        const res = await fetch('/api/mapaturistico/pontos');
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        allPoints = json.data;
        updateCounts();
        renderMarkers();
      } catch (err) {
        showToast('Erro ao carregar pontos');
        console.error(err);
      }
    }

    function renderMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const visible = allPoints.filter(p => {
        const catOk = currentFilter === 'all' || p.categoria === currentFilter;
        const srcOk = !currentSearch ||
          p.nome.toLowerCase().includes(currentSearch) ||
          (p.descricao||'').toLowerCase().includes(currentSearch) ||
          (p.endereco||'').toLowerCase().includes(currentSearch);
        return catOk && srcOk;
      });

      visible.forEach(p => {
        const m = L.marker([p.latitude, p.longitude], { icon: createMarkerIcon(p) })
          .addTo(map)
          .bindPopup(createPopupContent(p), { maxWidth: 300, minWidth: 296, className: '' });
        markers.push(m);
      });

      document.getElementById('visibleCount').textContent = visible.length;
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
      renderMarkers();
      if (window.innerWidth <= 768) closeFilterMobile();
    }

    function searchPoints(val) {
      currentSearch = val.trim().toLowerCase();
      renderMarkers();
    }

    function updateCounts() {
      document.getElementById('count-all').textContent = allPoints.length;
      ['atracao','restaurante','hotel','comercio','cultura','natureza','servico','clube','religioso'].forEach(c => {
        const el = document.getElementById(`count-${c}`);
        if (el) el.textContent = allPoints.filter(p => p.categoria === c).length;
      });
    }

    // ============================================================
    function openGpsModal(id, lat, lng, nome) {
      document.getElementById('gpsModalDesc').textContent = `Rota para: "${nome}"`;
      const gm = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
      const wz = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;
      const am = `http://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`;

      document.getElementById('gpsOptions').innerHTML = `
        <a href="${gm}" target="_blank" class="gps-option-btn" onclick="closeGpsModal()">
          <div class="gps-option-icon" style="background:linear-gradient(135deg,#4285f4,#34a853)">🗺️</div>
          <div class="gps-option-text">Google Maps<small>Abrir no Google Maps</small></div>
          <i class="fas fa-external-link-alt" style="margin-left:auto;color:rgba(255,255,255,0.3)"></i>
        </a>
        <a href="${wz}" target="_blank" class="gps-option-btn" onclick="closeGpsModal()">
          <div class="gps-option-icon" style="background:linear-gradient(135deg,#05c8f7,#4db8e8)">🚗</div>
          <div class="gps-option-text">Waze<small>Abrir no Waze</small></div>
          <i class="fas fa-external-link-alt" style="margin-left:auto;color:rgba(255,255,255,0.3)"></i>
        </a>
        <a href="${am}" target="_blank" class="gps-option-btn" onclick="closeGpsModal()">
          <div class="gps-option-icon" style="background:linear-gradient(135deg,#666,#999)">📍</div>
          <div class="gps-option-text">Apple Maps<small>Abrir no Apple Maps</small></div>
          <i class="fas fa-external-link-alt" style="margin-left:auto;color:rgba(255,255,255,0.3)"></i>
        </a>`;

      document.getElementById('gpsModal').classList.add('active');
    }

    function closeGpsModal() { document.getElementById('gpsModal').classList.remove('active'); }
    document.getElementById('gpsModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeGpsModal(); });

    function sharePonto(nome, lat, lng) {
      const url = `https://www.google.com/maps?q=${lat},${lng}`;
      if (navigator.share) navigator.share({ title: nome, text: `Confira: ${nome}`, url });
      else navigator.clipboard.writeText(url).then(() => showToast('Link copiado!'));
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ============================================================
    // Mobile filter panel
    function toggleFilterMobile() {
      document.getElementById('filterPanel').classList.toggle('mobile-open');
      document.getElementById('filterOverlay').classList.toggle('active');
    }
    function closeFilterMobile() {
      document.getElementById('filterPanel').classList.remove('mobile-open');
      document.getElementById('filterOverlay').classList.remove('active');
    }

    // Show/hide mobile toggle
    function checkMobile() {
      const isMobile = window.innerWidth <= 768;
      document.getElementById('filterToggleMobile').style.display = isMobile ? 'flex' : 'none';
    }
    window.addEventListener('resize', checkMobile);
    checkMobile();

    // ============================================================
    loadPoints();
  </script>
</body>
</html>
