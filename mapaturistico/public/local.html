<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes do Local - Mapa Turístico</title>
  <meta name="description" content="Informações detalhadas sobre o ponto turístico de Garça, São Paulo." />

  <!-- Rubik Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    @font-face {
      font-family: 'Klinic Slab';
      src: local('Klinic Slab'), local('KlinicSlab');
    }

    :root {
      --blue:    rgb(56, 77, 156);
      --blue-dk: rgb(38, 52, 110);
      --blue-lt: rgb(80, 105, 190);
      --green:   rgb(116, 150, 102);
      --green-lt: rgb(148, 183, 132);
      --orange:  rgb(237, 151, 86);
      --coral:   rgb(238, 112, 112);

      --bg:       #111828;
      --bg-deep:  #0d1320;
      --bg-surface: rgba(255,255,255,0.03);
      --text:     #e8eeff;
      --text-dim: rgba(255,255,255,0.5);
      --border:   rgba(255,255,255,0.08);
      --border-blue: rgba(56,77,156,0.4);
      --header-h: 70px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    .header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: linear-gradient(135deg, var(--bg-deep) 0%, var(--blue-dk) 100%);
      border-bottom: 2px solid var(--blue);
      display: flex; align-items: center;
      padding: 0 20px; z-index: 100;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4);
      gap: 10px;
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 9px;
      background: rgba(255,255,255,0.1); color: white;
      text-decoration: none; font-size: 13px; font-weight: 500;
      transition: 0.2s; border: 1px solid rgba(255,255,255,0.1);
      white-space: nowrap;
    }
    .btn-back:hover { background: rgba(255,255,255,0.2); transform: translateX(-2px); }

    .header-title { flex: 1; text-align: center; font-family: 'Klinic Slab', serif; font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-logo { height: 40px; margin-left: auto; }

    .container {
      max-width: 900px; margin: var(--header-h) auto 60px;
      padding: 30px 20px; width: 100%; flex: 1;
    }

    .carousel-wrap {
      position: relative; width: 100%; height: 450px;
      border-radius: 20px; overflow: hidden;
      margin-bottom: 30px; background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid var(--border-blue);
    }
    .carousel-inner {
      display: flex; width: 100%; height: 100%;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .carousel-slide {
      min-width: 100%; height: 100%;
      background-size: cover; background-position: center;
      position: relative;
    }
    .carousel-slide::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(13,19,32,0.9) 0%, transparent 40%);
    }
    .carousel-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(13,19,32,0.6); color: white; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; transition: 0.2s; z-index: 10;
      backdrop-filter: blur(5px);
    }
    .carousel-btn:hover { background: var(--blue); border-color: var(--blue-lt); }
    .carousel-prev { left: 15px; }
    .carousel-next { right: 15px; }
    .carousel-dots {
      position: absolute; bottom: 15px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 8px; z-index: 10;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: 0.3s; }
    .dot.active { background: white; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.5); }

    .ph-slide {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; background: var(--bg-surface); color: var(--text-dim);
      position: relative; z-index: 1;
    }
    .ph-slide i { font-size: 60px; margin-bottom: 10px; opacity: 0.5; }

    .main-card {
      background: rgba(255,255,255,0.02); border: 1px solid var(--border);
      border-radius: 20px; padding: 30px; margin-bottom: 30px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      margin-bottom: 15px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.05); color: var(--text-dim);
    }
    .badge.atracao { background: rgba(56,77,156,0.2); color: #a8b8f0; border-color: rgba(56,77,156,0.4); }
    .badge.natureza { background: rgba(116,150,102,0.2); color: #b8d4a8; border-color: rgba(116,150,102,0.4); }
    .badge.cultura { background: rgba(90,60,140,0.2); color: #c8b4f0; border-color: rgba(90,60,140,0.4); }
    .badge.restaurante { background: rgba(238,112,112,0.2); color: #f7b8b8; border-color: rgba(238,112,112,0.4); }
    .badge.hotel { background: rgba(237,151,86,0.2); color: #f7d0a8; border-color: rgba(237,151,86,0.4); }
    .badge.comercio { background: rgba(116,150,102,0.2); color: #b8d4a8; border-color: rgba(116,150,102,0.4); }
    .badge.servico { background: rgba(80,90,110,0.2); color: #c0c8d8; border-color: rgba(80,90,110,0.4); }
    .badge.clube { background: rgba(59,130,246,0.2); color: #bfdbfe; border-color: rgba(59,130,246,0.4); }
    .badge.religioso { background: rgba(139,92,246,0.2); color: #d8b4fe; border-color: rgba(139,92,246,0.4); }

    .title { font-family: 'Klinic Slab', serif; font-size: 32px; font-weight: 700; color: white; margin-bottom: 15px; line-height: 1.2; }
    .desc { font-size: 15px; color: rgba(255,255,255,0.7); line-height: 1.7; margin-bottom: 25px; }

    .meta-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
      background: rgba(0,0,0,0.2); padding: 20px; border-radius: 14px;
    }
    .meta-item { display: flex; align-items: flex-start; gap: 12px; }
    .meta-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--orange); flex-shrink: 0; }
    .meta-text { display: flex; flex-direction: column; }
    .meta-lbl { font-size: 10px; text-transform: uppercase; color: var(--text-dim); font-weight: 600; margin-bottom: 2px; }
    .meta-val { font-size: 13px; color: white; line-height: 1.4; }
    .meta-val a { color: var(--blue-lt); text-decoration: none; }

    .section { margin-bottom: 40px; }
    .section-title {
      font-family: 'Klinic Slab', serif; font-size: 22px; color: var(--green-lt);
      margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
      padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .section-content {
      background: var(--bg-surface); padding: 25px; border-radius: 16px;
      border: 1px solid var(--border);
      font-size: 14px; line-height: 1.8; color: rgba(255,255,255,0.75);
      white-space: pre-wrap;
    }

    #loading, #error { text-align: center; padding: 100px 20px; }
    #loading i { font-size: 40px; color: var(--blue); margin-bottom: 15px; }
    #content { display: none; }

    @media (max-width: 768px) {
      .carousel-wrap { height: 300px; }
      .title { font-size: 24px; }
      .main-card { padding: 20px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="/mapaturistico/" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar ao Mapa</a>
    <div class="header-title" id="headTitle">Detalhes</div>
    <img src="/mapaturistico/garca_logo.png" alt="Garça" class="header-logo" />
  </header>

  <div id="loading">
    <i class="fas fa-circle-notch fa-spin"></i>
    <p>Carregando informações...</p>
  </div>

  <div id="error" style="display:none;">
    <i class="fas fa-exclamation-triangle" style="font-size:50px;color:var(--coral);margin-bottom:20px;"></i>
    <h2>Local não encontrado</h2>
    <p style="color:var(--text-dim);margin-top:10px;">O ponto turístico solicitado não existe ou foi removido.</p>
    <a href="/mapaturistico/" class="btn-back" style="margin-top:20px;background:var(--blue);border-color:var(--blue);">Voltar ao Mapa</a>
  </div>

  <div class="container" id="content">
    <div class="carousel-wrap" id="carousel">
      <div class="carousel-inner" id="carouselInner"></div>
      <button class="carousel-btn carousel-prev" onclick="moveSlide(-1)" id="btnPrev"><i class="fas fa-chevron-left"></i></button>
      <button class="carousel-btn carousel-next" onclick="moveSlide(1)" id="btnNext"><i class="fas fa-chevron-right"></i></button>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <div class="main-card">
      <div class="badge" id="placeBadge"></div>
      <h1 class="title" id="placeTitle"></h1>
      <p class="desc" id="placeDesc"></p>

      <div class="meta-grid" id="metaGrid">
        <div class="meta-item" id="metaAddress" style="display:none">
          <div class="meta-icon"><i class="fas fa-map-marker-alt"></i></div>
          <div class="meta-text"><span class="meta-lbl">Endereço</span><span class="meta-val" id="valAddress"></span></div>
        </div>
        <div class="meta-item" id="metaPhone" style="display:none">
          <div class="meta-icon"><i class="fas fa-phone"></i></div>
          <div class="meta-text"><span class="meta-lbl">Telefone</span><span class="meta-val" id="valPhone"></span></div>
        </div>
        <div class="meta-item" id="metaHours" style="display:none">
          <div class="meta-icon"><i class="fas fa-clock"></i></div>
          <div class="meta-text"><span class="meta-lbl">Horário</span><span class="meta-val" id="valHours"></span></div>
        </div>
        <div class="meta-item" id="metaSite" style="display:none">
          <div class="meta-icon"><i class="fas fa-globe"></i></div>
          <div class="meta-text"><span class="meta-lbl">Site</span><span class="meta-val"><a href="#" id="valSite" target="_blank" rel="noopener noreferrer">Acessar</a></span></div>
        </div>
      </div>
    </div>

    <div class="section" id="secHist" style="display:none">
      <h2 class="section-title"><i class="fas fa-book-open"></i> Dados Históricos</h2>
      <div class="section-content" id="valHist"></div>
    </div>

    <div class="section" id="secEvents" style="display:none">
      <h2 class="section-title"><i class="fas fa-calendar-alt"></i> Eventos</h2>
      <div class="section-content" id="valEvents"></div>
    </div>
  </div>

  <script>
    const CATS = {
      atracao: { label: 'Atração', icon: 'fa-star' },
      restaurante: { label: 'Restaurante', icon: 'fa-utensils' },
      hotel: { label: 'Hotel', icon: 'fa-bed' },
      comercio: { label: 'Comércio', icon: 'fa-shopping-bag' },
      cultura: { label: 'Cultura', icon: 'fa-landmark' },
      natureza: { label: 'Natureza', icon: 'fa-leaf' },
      servico: { label: 'Serviço', icon: 'fa-wrench' },
      clube: { label: 'Clube', icon: 'fa-futbol' },
      religioso: { label: 'Religioso', icon: 'fa-place-of-worship' }
    };
    let currentSlide = 0;
    let totalSlides = 0;

    function hasValue(value) {
      return value !== undefined && value !== null && String(value).trim() !== '';
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
    }

    function setHtmlWithLineBreaks(el, raw) {
      el.innerHTML = escapeHtml(raw).replace(/\n/g, '<br>');
    }

    function renderCarousel(fotos) {
      const inner = document.getElementById('carouselInner');
      const dots = document.getElementById('carouselDots');
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');

      if (!fotos.length) {
        inner.innerHTML = '<div class="carousel-slide ph-slide"><i class="fas fa-camera"></i><p>Sem imagens disponíveis</p></div>';
        btnPrev.style.display = 'none';
        btnNext.style.display = 'none';
        dots.innerHTML = '';
        totalSlides = 0;
        return;
      }

      totalSlides = fotos.length;
      currentSlide = 0;
      inner.style.transform = 'translateX(0%)';
      inner.innerHTML = fotos
        .map((f) => `<div class="carousel-slide" style="background-image:url('${encodeURI(f)}')"></div>`)
        .join('');

      if (totalSlides > 1) {
        dots.innerHTML = fotos
          .map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`)
          .join('');
        btnPrev.style.display = 'flex';
        btnNext.style.display = 'flex';
      } else {
        dots.innerHTML = '';
        btnPrev.style.display = 'none';
        btnNext.style.display = 'none';
      }
    }

    function updateCarousel() {
      document.getElementById('carouselInner').style.transform = `translateX(-${currentSlide * 100}%)`;
      const dots = document.querySelectorAll('.dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    }

    function moveSlide(dir) {
      if (totalSlides <= 1) return;
      currentSlide = (currentSlide + dir + totalSlides) % totalSlides;
      updateCarousel();
    }

    function goToSlide(idx) {
      currentSlide = idx;
      updateCarousel();
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) throw new Error('Local não encontrado');

      try {
        const res = await fetch(`/api/mapaturistico/pontos/${id}`);
        const json = await res.json();
        if (!res.ok || !json.success || !json.data) throw new Error('not_found');

        const ponto = json.data;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'flex';
        document.getElementById('content').style.flexDirection = 'column';

        document.getElementById('headTitle').textContent = ponto.nome || 'Detalhes';
        document.getElementById('placeTitle').textContent = ponto.nome || 'Local Turístico';
        document.title = `${ponto.nome || 'Local'} - Mapa Turístico de Garça`;

        const cat = CATS[ponto.categoria] || CATS.atracao;
        const badge = document.getElementById('placeBadge');
        badge.className = `badge ${ponto.categoria || ''}`;
        badge.innerHTML = `<i class="fas ${cat.icon}"></i> ${cat.label}${ponto.destaque ? ' <span style="color:var(--orange);margin-left:4px">⭐ Destaque</span>' : ''}`;

        if (hasValue(ponto.descricao)) {
          document.getElementById('placeDesc').textContent = ponto.descricao;
        } else {
          document.getElementById('placeDesc').style.display = 'none';
        }

        if (hasValue(ponto.endereco)) {
          document.getElementById('metaAddress').style.display = 'flex';
          document.getElementById('valAddress').textContent = ponto.endereco;
        }
        if (hasValue(ponto.telefone)) {
          document.getElementById('metaPhone').style.display = 'flex';
          document.getElementById('valPhone').textContent = ponto.telefone;
        }
        if (hasValue(ponto.horario)) {
          document.getElementById('metaHours').style.display = 'flex';
          document.getElementById('valHours').textContent = ponto.horario;
        }
        if (hasValue(ponto.site)) {
          document.getElementById('metaSite').style.display = 'flex';
          document.getElementById('valSite').href = ponto.site;
          try {
            document.getElementById('valSite').textContent = new URL(ponto.site).hostname;
          } catch (_) {
            document.getElementById('valSite').textContent = ponto.site;
          }
        }

        if (!hasValue(ponto.endereco) && !hasValue(ponto.telefone) && !hasValue(ponto.horario) && !hasValue(ponto.site)) {
          document.getElementById('metaGrid').style.display = 'none';
        }

        if (hasValue(ponto.dadosHistoricos)) {
          document.getElementById('secHist').style.display = 'block';
          setHtmlWithLineBreaks(document.getElementById('valHist'), ponto.dadosHistoricos);
        }
        if (hasValue(ponto.eventos)) {
          document.getElementById('secEvents').style.display = 'block';
          setHtmlWithLineBreaks(document.getElementById('valEvents'), ponto.eventos);
        }

        const fotos = [];
        if (hasValue(ponto.foto)) fotos.push(ponto.foto);
        if (Array.isArray(ponto.fotos)) {
          ponto.fotos.forEach((foto) => {
            if (hasValue(foto) && !fotos.includes(foto)) fotos.push(foto);
          });
        }
        renderCarousel(fotos);
      } catch (err) {
        showError();
      }
    }

    init();
  </script>
</body>
</html>
