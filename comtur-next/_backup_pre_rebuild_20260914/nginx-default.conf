# Redireciona HTTP -> HTTPS (mantém ACME)
server {
  listen 80;
  server_name api.garca.sp.gov.br;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }

  location /nginx-health { return 200; }
}

# HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name api.garca.sp.gov.br;

  ssl_certificate     /etc/letsencrypt/live/api.garca.sp.gov.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.garca.sp.gov.br/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;
  ssl_ciphers HIGH:!aNULL:!MD5;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # TESTE DO BINHO
  location /scpi9/ {
      proxy_pass http://10.15.25.7:8079/scpi9/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
      add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';
  }

   location /transparencia {
      proxy_pass http://10.15.25.7:8079/transparencia/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header Access-Control-Allow-Origin *;
      add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
      add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept';
      #rewrite ^/transparencia/(.*)$ /$1 break;
  }
  ###################################

  location /nginx-health { return 200; }

  # Imagens gerais (sepultados, users, etc)
  location /api/images/ {
    alias /data/apicemiterio/;
    expires 30d;
    add_header Cache-Control "public" always;
    add_header Access-Control-Allow-Origin $http_origin always;
  }

  # Arquivos de formulários (documentos, PDFs, etc)
  location /api/images/forms/ {
    alias /data/apicemiterio/forms/;
    expires 7d;
    add_header Cache-Control "public" always;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Content-Disposition "inline" always;
    
    # Tipos MIME adicionais para documentos
    types {
      application/pdf pdf;
      application/msword doc;
      application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
      application/vnd.ms-excel xls;
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
      text/plain txt;
      application/zip zip;
      application/x-rar-compressed rar;
    }
  }

  location /api/ {
    proxy_pass http://api:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Authorization $http_authorization;

    proxy_redirect off;
    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods GET,POST,PATCH,PUT,DELETE,OPTIONS always;
      add_header Access-Control-Allow-Headers Authorization,Content-Type,Origin,Accept,X-Requested-With,Cache-Control,Pragma always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Vary Origin always;
      return 204;
    }
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Vary Origin always;
  }

  # =============================================
  # Aplicação Flutter - Agendamentos
  # =============================================
  location = /agendamentos {
    return 301 /agendamentos/;
  }

  location /agendamentos/ {
    root /usr/share/nginx/html;
    index index.html;
    
    # Fallback para index.html do Flutter
    try_files $uri $uri/ /agendamentos/index.html;
    
    # Headers para Flutter Web
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Cache para assets estáticos do Flutter
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|bin|json)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # =============================================
  # Aplicação Flutter - Formulários
  # =============================================
  location = /formularios {
    return 301 /formularios/;
  }

  location /formularios/ {
    root /usr/share/nginx/html;
    index index.html;
    
    # Fallback para index.html do Flutter
    try_files $uri $uri/ /formularios/index.html;
    
    # Headers para Flutter Web
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Cache para assets estáticos do Flutter
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|bin|json)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # =============================================
  # DASHBOARD E ASSETS DA API
  # =============================================
  location = /dashboard.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    proxy_pass http://api:5000/dashboard.html;
    proxy_set_header Host $host;
  }

  location = /routes.json {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    proxy_pass http://api:5000/routes.json;
    proxy_set_header Host $host;
  }

  location = /endpoints.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    proxy_pass http://api:5000/endpoints.html;
    proxy_set_header Host $host;
  }

  location = /health {
    proxy_pass http://api:5000/health;
    proxy_set_header Host $host;
  }

  # =============================================
  # SAMA (React no Backend)
  # =============================================
  location ^~ /sama/ {
    proxy_pass http://api:5000/sama/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # =============================================
  # Aplicação Flutter - Serviços
  # =============================================
  location = /servicos {
    return 301 /servicos/;
  }

  location /servicos/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /servicos/index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|bin|json)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  # =============================================
  # Aplicação Flutter - Iluminação
  # =============================================
  location = /iluminacao {
    return 301 /iluminacao/;
  }

  location /iluminacao/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /iluminacao/index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|bin|json)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server_tokens off;
  proxy_hide_header X-Powered-By;
}
