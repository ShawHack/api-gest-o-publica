# Fragmento Nginx — portal Visit Garça
# Incluir no server 443 depois de conferir o arquivo montado no container nginx.
# Não aplicar este arquivo inteiro no lugar da configuração de produção.

location = /turismo { return 301 /turismo/; }
location = /turismo/mapa { return 302 /mapaturistico/; }
location = /turismo/mapa/ { return 302 /mapaturistico/; }
location ^~ /turismo/ {
  root /opt/backend-public;
  index index.html;
  try_files $uri $uri/ /turismo/index.html =404;
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
location = /comtur-portal.html { return 302 /turismo/comtur; }
