services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govcidadao-frontend
    ports:
      - "3010:3000"
    environment:
      NEXT_PUBLIC_API_URL: /garca-cidadao-api
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    container_name: govcidadao-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: GovCidadao API
      APP_VERSION: 1.0.0
      MONGO_URI: mongodb://govcidadao-mongo:27017
      MONGO_DB: govcidadao
      DEFAULT_SLA_DAYS: 5
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode()==200 else sys.exit(1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: govcidadao-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
