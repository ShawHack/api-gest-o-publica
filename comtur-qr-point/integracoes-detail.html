<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Integração — Turismo Garça</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,sans-serif;color:#10213f;background:#f4f7fb}
    header,main{max-width:980px;margin:auto;padding:22px}
    header{display:flex;justify-content:space-between;gap:12px}
    a{color:#075d57}.card{background:#fff;border-radius:18px;padding:clamp(18px,4vw,40px);box-shadow:0 14px 40px #10213f14}
    h1{line-height:1.15;margin:0 0 10px}.meta{color:#52627a}.section{margin-top:28px}
    .section h2{margin:0 0 10px;font-size:1.15rem}
    .kv{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;margin:14px 0}
    .kv dt{color:#64748b;font-weight:600}.kv dd{margin:0}
    .btn{display:inline-flex;padding:12px 16px;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;text-decoration:none}
    .error{padding:30px;border-left:5px solid #d44848;background:#fff}
    .badge{display:inline-block;padding:4px 10px;border-radius:8px;background:#ecfdf5;color:#065f46;font-size:.85rem;font-weight:700}
  </style>
</head>
<body>
  <header>
    <a href="/turismo/integracoes/">← Integrações</a>
    <a href="/turismo/">Turismo Garça</a>
  </header>
  <main><article id="content" class="card" aria-live="polite">Carregando…</article></main>
  <script>
  (() => {
    const box = document.getElementById('content');
    const parts = location.pathname.split('/').filter(Boolean);
    const slug = decodeURIComponent(parts[parts.length - 1] || '');
    if (!slug || slug === 'integracoes') {
      box.className = 'error';
      box.textContent = 'Integração não informada.';
      return;
    }
    const add = (tag, text, cls) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      e.textContent = text;
      box.append(e);
      return e;
    };
    fetch(`/api/comtur/content/${encodeURIComponent(slug)}`)
      .then((r) => { if (!r.ok) throw Error(r.status); return r.json(); })
      .then(({ data: p }) => {
        if (!p || p.type !== 'integration' || p.status !== 'published') throw Error('not-public');
        const meta = p.metadata || {};
        if (meta.showOnPortal === false) throw Error('hidden');
        box.textContent = '';
        document.title = `${p.title} — Integrações`;
        if (meta.techStatus) {
          const b = document.createElement('div');
          b.className = 'badge';
          b.textContent = meta.techStatus;
          b.style.marginBottom = '12px';
          box.append(b);
        }
        add('h1', p.title);
        if (meta.description || p.summary) add('p', meta.description || p.summary, 'meta');

        const dl = document.createElement('dl');
        dl.className = 'kv';
        const rows = [
          ['Tipo', meta.kind || meta.integrationType],
          ['Sistema / plataforma', meta.system || meta.platform],
          ['Órgão responsável', meta.responsibleBody || p.location],
          ['O que é integrado', meta.integratesWhat || meta.scope],
          ['Direção', meta.direction],
          ['Periodicidade', meta.periodicity],
          ['Última sincronização', meta.lastSync ? new Date(meta.lastSync).toLocaleDateString('pt-BR') : ''],
        ];
        rows.forEach(([k, v]) => {
          if (!v) return;
          const dt = document.createElement('dt'); dt.textContent = k;
          const dd = document.createElement('dd'); dd.textContent = v;
          dl.append(dt, dd);
        });
        box.append(dl);

        if (meta.notes || p.body) {
          const s = document.createElement('section'); s.className = 'section';
          s.innerHTML = '<h2>Observações</h2>';
          const pEl = document.createElement('p'); pEl.textContent = meta.notes || p.body; s.append(pEl);
          box.append(s);
        }

        if (meta.publicUrl || meta.documentationUrl) {
          const s = document.createElement('section'); s.className = 'section';
          const a = document.createElement('a');
          a.className = 'btn';
          a.href = meta.publicUrl || meta.documentationUrl;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = 'Abrir documentação / URL pública';
          s.append(a);
          box.append(s);
        }
      })
      .catch(() => {
        box.className = 'error';
        box.textContent = 'Esta integração ainda não está publicada ou não está disponível no portal.';
      });
  })();
  </script>
</body>
</html>
