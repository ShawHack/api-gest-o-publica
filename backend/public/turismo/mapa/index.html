<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa Turístico — Turismo Garça</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;color:#10213f;background:#f4f7fb}header{padding:18px 5%;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;justify-content:space-between;align-items:center}a{color:#075d57}main{display:grid;grid-template-columns:minmax(300px,34%) 1fr;min-height:calc(100vh - 78px)}aside{padding:24px;overflow:auto;background:#fff}#map{min-height:620px}.filters{display:grid;gap:10px}input,select{width:100%;padding:12px;border:1px solid #aab8ca;border-radius:8px;font:inherit}.item{display:block;padding:14px 0;border-bottom:1px solid #dbe3ef;text-decoration:none;color:#10213f}.item strong{display:block}.item span,.status{color:#52627a}.status{padding:16px 0}@media(max-width:800px){main{display:flex;flex-direction:column-reverse}#map{min-height:55vh}aside{overflow:visible}}</style></head>
<body><header><div><small>PREFEITURA DE GARÇA</small><br><strong>Mapa Turístico</strong></div><a href="/turismo/">Voltar ao Turismo Garça</a></header>
<main><aside><h1>Conheça Garça</h1><p>Locais oficiais revisados e publicados pela equipe municipal.</p><div class="filters"><label>Buscar local<input id="search" type="search" placeholder="Nome, resumo ou endereço"></label><label>Categoria<select id="type"><option value="">Todas</option><option value="attraction">Atrativos</option><option value="gastronomy">Gastronomia</option><option value="lodging">Hospedagem</option><option value="route">Roteiros</option><option value="shopping">Compras</option><option value="service">Serviços</option></select></label></div><div id="status" class="status" aria-live="polite">Carregando locais…</div><nav id="list" aria-label="Locais turísticos"></nav></aside><div id="map" role="region" aria-label="Mapa dos locais turísticos"></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(()=>{const status=document.querySelector('#status'),list=document.querySelector('#list'),search=document.querySelector('#search'),type=document.querySelector('#type');const map=L.map('map').setView([-22.212,-49.656],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);const layer=L.layerGroup().addTo(map);let points=[];function render(){const q=search.value.trim().toLocaleLowerCase('pt-BR');const filtered=points.filter(p=>(!type.value||p.type===type.value)&&(!q||`${p.title} ${p.summary||''} ${p.location||''}`.toLocaleLowerCase('pt-BR').includes(q)));list.textContent='';layer.clearLayers();status.textContent=`${filtered.length} de ${points.length} local(is).`;const bounds=[];filtered.forEach(p=>{const url=`/turismo/local/${encodeURIComponent(p.slug)}`;const a=document.createElement('a');a.className='item';a.href=url;const title=document.createElement('strong');title.textContent=p.title;const loc=document.createElement('span');loc.textContent=p.location||'Garça — SP';a.append(title,loc);list.append(a);const marker=L.marker([p.geo.lat,p.geo.lng]).addTo(layer);marker.bindPopup(document.createTextNode(p.title));marker.on('click',()=>a.focus());bounds.push([p.geo.lat,p.geo.lng])});if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:16})}search.addEventListener('input',render);type.addEventListener('change',render);fetch('/api/comtur/map/locations').then(r=>{if(!r.ok)throw Error();return r.json()}).then(({data=[]})=>{points=data;if(!points.length){status.textContent='Os locais estão em revisão editorial. O mapa antigo permanece disponível durante esta etapa.';const a=document.createElement('a');a.href='/mapaturistico/';a.textContent='Acessar mapa atual';list.append(a);return}render()}).catch(()=>{status.textContent='Não foi possível carregar o mapa agora.';const a=document.createElement('a');a.href='/mapaturistico/';a.textContent='Acessar mapa atual';list.append(a)})})();</script></body></html>
