<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pesquisa — Turismo Garça</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,sans-serif;color:#10213f;background:#f4f7fb}
    header,main{max-width:980px;margin:auto;padding:22px}
    header{display:flex;justify-content:space-between;gap:12px}
    a{color:#075d57} .card{background:#fff;border-radius:18px;padding:clamp(18px,4vw,40px);box-shadow:0 14px 40px #10213f14}
    .cover{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin-bottom:18px}
    h1{line-height:1.15;margin:0 0 10px}.meta{color:#52627a}.section{margin-top:28px}
    .section h2{margin:0 0 10px;font-size:1.15rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
    .stat{background:#f0fdfa;border:1px solid #99f6e4;border-radius:14px;padding:16px;text-align:center}
    .stat strong{display:block;font-size:1.6rem;color:#0f766e}.btn{display:inline-flex;gap:8px;align-items:center;padding:12px 16px;border-radius:10px;background:#0f766e;color:#fff;font-weight:700;text-decoration:none}
    .error{padding:30px;border-left:5px solid #d44848;background:#fff}
  </style>
</head>
<body>
  <header>
    <a href="/turismo/pesquisas/">← Pesquisas</a>
    <a href="/turismo/">Turismo Garça</a>
  </header>
  <main><article id="content" class="card" aria-live="polite">Carregando…</article></main>
  <script>
  (() => {
    const box = document.getElementById('content');
    const parts = location.pathname.split('/').filter(Boolean);
    const slug = decodeURIComponent(parts[parts.length - 1] || '');
    if (!slug || slug === 'pesquisas') {
      box.className = 'error';
      box.textContent = 'Pesquisa não informada.';
      return;
    }
    const add = (tag, text, cls) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      e.textContent = text;
      box.append(e);
      return e;
    };
    fetch(`/api/comtur/content/${encodeURIComponent(slug)}`)
      .then((r) => { if (!r.ok) throw Error(r.status); return r.json(); })
      .then(({ data: p }) => {
        if (!p || p.type !== 'research' || p.status !== 'published') throw Error('not-public');
        box.textContent = '';
        document.title = `${p.title} — Turismo Garça`;
        const meta = p.metadata || {};
        const cover = (p.media || []).find((m) => m.kind === 'image');
        const pdf = (p.media || []).find((m) => m.kind === 'document' || (m.url || '').toLowerCase().endsWith('.pdf')) || meta.pdfFile;
        if (cover?.url || meta.coverUrl) {
          const img = document.createElement('img');
          img.className = 'cover';
          img.src = cover?.url || meta.coverUrl;
          img.alt = meta.photoAlt || `Capa de ${p.title}`;
          box.append(img);
        }
        add('h1', p.title);
        const start = p.startsAt || meta.startDate;
        const end = p.endsAt || meta.endDate;
        const period = (start || end)
          ? `${start ? new Date(start).toLocaleDateString('pt-BR') : '?'}${end ? ' a ' + new Date(end).toLocaleDateString('pt-BR') : ''}`
          : '';
        if (period) add('p', `Período: ${period}`, 'meta');
        if (meta.participants != null) add('p', `Participantes: ${meta.participants}`, 'meta');
        if (meta.audience) add('p', `Público: ${meta.audience}`, 'meta');
        if (p.location || meta.coverage) add('p', `Abrangência: ${p.location || meta.coverage}`, 'meta');

        const objective = meta.objective || p.summary || '';
        if (objective) {
          const s = document.createElement('section'); s.className = 'section';
          s.innerHTML = '<h2>Objetivo da pesquisa</h2>';
          const pEl = document.createElement('p'); pEl.textContent = objective; s.append(pEl);
          box.append(s);
        }

        const results = Array.isArray(meta.highlightedResults) ? meta.highlightedResults : [];
        if (results.length) {
          const s = document.createElement('section'); s.className = 'section';
          s.innerHTML = '<h2>Resultados</h2>';
          const stats = document.createElement('div'); stats.className = 'stats';
          results.forEach((r) => {
            const d = document.createElement('div'); d.className = 'stat';
            const val = r.value == null ? '—' : `${r.value}${r.unit ? r.unit : ''}`;
            d.innerHTML = `<strong>${val}</strong><span>${r.indicator || 'Indicador'}</span>`;
            stats.append(d);
          });
          s.append(stats);
          box.append(s);
        }

        if (meta.summaryResults) {
          const s = document.createElement('section'); s.className = 'section';
          s.innerHTML = '<h2>Resumo dos resultados</h2>';
          const pEl = document.createElement('p'); pEl.textContent = meta.summaryResults; s.append(pEl);
          box.append(s);
        }

        const methodology = meta.methodology || p.body || '';
        if (methodology) {
          const s = document.createElement('section'); s.className = 'section';
          s.innerHTML = '<h2>Metodologia</h2>';
          const pEl = document.createElement('p'); pEl.textContent = methodology; s.append(pEl);
          box.append(s);
        }

        if (meta.conclusions) {
          const s = document.createElement('section'); s.className = 'section';
          s.innerHTML = '<h2>Principais conclusões</h2>';
          const pEl = document.createElement('p'); pEl.textContent = meta.conclusions; s.append(pEl);
          box.append(s);
        }

        if (pdf?.url) {
          const s = document.createElement('section'); s.className = 'section';
          s.innerHTML = '<h2>Relatório completo</h2>';
          const a = document.createElement('a');
          a.className = 'btn';
          a.href = pdf.url;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = '📄 Baixar relatório completo';
          s.append(a);
          box.append(s);
        }
      })
      .catch(() => {
        box.className = 'error';
        box.textContent = 'Esta pesquisa ainda não está publicada ou não foi encontrada.';
      });
  })();
  </script>
</body>
</html>
