<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada - Prefeitura de Garça</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #364ba3 0%, #2c3e50 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .error-container {
      background: white;
      border-radius: 16px;
      padding: 48px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .error-code {
      font-size: 120px;
      font-weight: bold;
      color: #ed9756;
      line-height: 1;
      margin-bottom: 16px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    
    .error-title {
      font-size: 24px;
      color: #364ba3;
      margin-bottom: 16px;
    }
    
    .error-message {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    
    .error-btn {
      display: inline-block;
      background: #364ba3;
      color: white;
      padding: 14px 32px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(54, 75, 163, 0.4);
    }
    
    .error-btn:hover {
      background: #2c3e8a;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(54, 75, 163, 0.5);
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      opacity: 0.9;
    }
    
    .footer-text {
      margin-top: 32px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Página não encontrada</h1>
    <p class="error-message">
      A página que você está procurando não existe ou foi movida. 
      Verifique o endereço digitado ou volte para a página inicial.
    </p>
    <a href="/" class="error-btn">← Voltar ao Início</a>
    <p class="footer-text">Prefeitura Municipal de Garça - SEMIT</p>
  </div>
</body>
</html>
