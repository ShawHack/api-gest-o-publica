<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conteúdos e documentos — COMTUR</title><link rel="stylesheet" href="/comtur-admin.css?v=3"><style>
.page{padding:32px}.page-head{margin-bottom:24px}.page-head h1{margin:0 0 7px}.content-layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(440px,1.4fr);gap:20px}.content-list{display:grid;gap:9px}.content-item{width:100%;text-align:left;background:#fff;color:var(--text);border:1px solid var(--line)}.content-item:hover{border-color:var(--teal)}.content-item small{display:block;margin-top:5px;color:var(--muted)}.empty{padding:36px 12px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.panel h2{margin-top:0}.status{float:right;padding:5px 9px;border-radius:999px;background:#e7edf4;font-size:.78rem}.notice.error{background:#feeceb;color:#b42318}.upload-result{word-break:break-word}@media(max-width:980px){.content-layout{grid-template-columns:1fr}}@media(max-width:700px){.page{padding:20px 14px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="page"><header class="page-head"><h1>Conteúdos e documentos</h1><p class="muted">Governança, legislação, planejamento, turismo e dados abertos.</p></header><div id="notice" class="notice" role="status" aria-live="polite"></div><div class="content-layout"><section class="panel"><h2>Publicações</h2><div id="list" class="content-list">Carregando…</div></section><section class="panel"><span id="status" class="status">Rascunho</span><h2 id="formTitle">Novo conteúdo</h2><form id="form" class="form-grid"><input id="id" type="hidden"><div><label for="type">Tipo</label><select id="type"></select></div><div><label for="name">Título</label><input id="name" required></div><div class="full"><label for="slug">Identificador na URL</label><input id="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></div><div class="full"><label for="summary">Resumo</label><textarea id="summary"></textarea></div><div class="full"><label for="bodyText">Conteúdo completo</label><textarea id="bodyText"></textarea></div><div class="full"><label for="location">Local ou referência</label><input id="location"></div><div class="actions full"><button type="submit">Salvar</button><button type="button" class="secondary" id="newItem">Novo</button><button type="button" class="secondary" id="review">Enviar para revisão</button><button type="button" id="publish">Publicar</button><button type="button" class="secondary" id="archive">Arquivar</button></div></form><hr><h3>Documento ou mídia</h3><form id="upload" class="upload-box"><label for="file">Selecione o arquivo</label><input id="file" type="file" required><button type="submit">Verificar e enviar</button><p class="muted">Formatos permitidos são validados e todo arquivo passa por antivírus.</p><p id="uploadResult" class="upload-result"></p></form></section></div></main><script src="/comtur-admin-nav.js?v=3"></script><script>
const token=sessionStorage.getItem('semit_dashboard_token');if(!token)location.replace('/dashboard.html');const types={council_member:'Membro do Conselho',legislation:'Legislação',work_plan:'Plano de trabalho',accountability:'Prestação de contas',attraction:'Atrativo',event:'Evento',gastronomy:'Gastronomia',lodging:'Hospedagem',route:'Roteiro',news:'Notícia',indicator:'Indicador',research:'Pesquisa',open_data:'Dados abertos',qr_point:'Ponto QR',integration:'Integração'},$=id=>document.getElementById(id),headers=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});let items=[];$('type').innerHTML=Object.entries(types).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');async function request(url,options={}){const response=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}}),data=await response.json().catch(()=>({}));if(response.status===401){sessionStorage.removeItem('semit_dashboard_token');location.replace('/dashboard.html');throw Error('Sessão expirada.')}if(!response.ok)throw Error(data.error||data.message||'Não foi possível concluir a operação.');return data}function message(text,error=false){$('notice').textContent=text;$('notice').className='notice'+(error?' error':'');$('notice').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}function reset(){$('form').reset();$('id').value='';$('formTitle').textContent='Novo conteúdo';$('status').textContent='Rascunho'}function edit(item){$('id').value=item._id;$('type').value=item.type;$('name').value=item.title;$('slug').value=item.slug;$('summary').value=item.summary||'';$('bodyText').value=item.body||'';$('location').value=item.location||'';$('formTitle').textContent=item.title;$('status').textContent=item.status||'Rascunho'}async function load(){const data=await request('/api/comtur/admin/content');items=data.data||[];$('list').innerHTML=items.length?items.map((item,index)=>`<button class="content-item" type="button" data-index="${index}"><b>${item.title}</b><small>${types[item.type]||item.type} · ${item.status}</small></button>`).join(''):'<div class="empty">Nenhum conteúdo cadastrado.</div>';$('list').querySelectorAll('[data-index]').forEach(button=>button.onclick=()=>edit(items[Number(button.dataset.index)]))}
$('form').onsubmit=async event=>{event.preventDefault();try{const currentId=$('id').value,data=await request(currentId?'/api/comtur/admin/content/'+currentId:'/api/comtur/admin/content',{method:currentId?'PUT':'POST',body:JSON.stringify({type:$('type').value,title:$('name').value,slug:$('slug').value,summary:$('summary').value,body:$('bodyText').value,location:$('location').value})});edit(data.data);message('Conteúdo salvo com sucesso.');await load()}catch(error){message(error.message,true)}};async function transition(next){if(!$('id').value)return message('Salve o conteúdo antes de alterar seu estado.',true);try{const data=await request(`/api/comtur/admin/content/${$('id').value}/transition`,{method:'POST',body:JSON.stringify({status:next})});edit(data.data);message('Situação atualizada.');await load()}catch(error){message(error.message,true)}}$('newItem').onclick=reset;$('review').onclick=()=>transition('review');$('publish').onclick=()=>transition('published');$('archive').onclick=()=>transition('archived');$('upload').onsubmit=async event=>{event.preventDefault();const selected=$('file').files[0];if(!selected)return;const formData=new FormData();formData.append('file',selected);try{const response=await fetch('/api/comtur/admin/media',{method:'POST',headers:{Authorization:'Bearer '+token},body:formData}),data=await response.json();if(!response.ok)throw Error(data.error||'Falha no envio.');$('uploadResult').innerHTML=`Arquivo validado: <a href="${data.data.url}" target="_blank" rel="noopener">abrir arquivo</a>`;message('Arquivo enviado e verificado com sucesso.')}catch(error){message(error.message,true)}};load().catch(error=>message(error.message,true));
</script></body></html>
