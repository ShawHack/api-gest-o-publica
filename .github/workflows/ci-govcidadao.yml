name: CI GovCidadao

on:
  push:
    paths:
      - 'GovCidadao/**'
      - '.github/workflows/ci-govcidadao.yml'
  pull_request:
    paths:
      - 'GovCidadao/**'
      - '.github/workflows/ci-govcidadao.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GovCidadao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: GovCidadao/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Testes pytest
        run: pytest -q
        env:
          JWT_SECRET: ci-test-gov-jwt-secret
